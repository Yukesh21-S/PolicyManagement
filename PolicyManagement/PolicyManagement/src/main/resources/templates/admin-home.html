<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolicyTrust - Home</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
        }

        header {
            background-color: #2e6da4;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        main {
            padding: 40px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            font-size: 18px;
            color: #2e6da4;
            margin-bottom: 20px;
        }

        .card button {
            padding: 12px 25px;
            background-color: #428aac;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .card button:hover {
            background-color: #428aac;
        }

        footer {
            background-color: #2e6da4;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: #2e6da4;
        }
    </style>
</head>
<body>

<header>
    PolicyTrust - Insurance Management
</header>

<main>
    <h1>Welcome to PolicyTrust</h1>
    <p>Manage your policies and schemes efficiently with easy-to-use tools</p>

    <div class="container">
        <div class="card">
            <div class="card-icon">📄</div>
            <h2>Create Policy</h2>
            <button th:onclick="|window.location.href='@{/policies/create}'|">Create Policy</button>
        </div>

        <div class="card">
            <div class="card-icon">🔑</div>
            <h2>Create Scheme</h2>
            <button th:onclick="|window.location.href='@{/admin/schemes/new}'|">Create Scheme</button>
        </div>
        <div class="card">
            <div class="card-icon">🔑</div>
            <h2>Available Scheme</h2>
            <button th:onclick="|window.location.href='@{/admin/schemes/list-schemes}'|">View Scheme</button>
        </div>
        <div class="card">
            <div class="card-icon">🔑</div>
            <h2>Policies list</h2>
            <button th:onclick="|window.location.href='@{/policies}'|">View Policies</button>
        </div>
    </div>
</main>

<footer>
    <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> PolicyTrust. All Rights Reserved.</p>
</footer>

</body>
</html>
