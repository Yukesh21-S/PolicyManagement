<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Scheme</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }

        h1 {
            color: #2e6da4;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            background-color: #ffffff;
            padding: 20px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 700px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background-color: #428aac;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2e6da4;
        }

        .error-message {
            color: #d9534f;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            form {
                padding: 15px;
                width: 90%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<h1>Create New Scheme</h1>

<!-- Error Message Placeholder -->
<div class="error-message" th:if="${error}">
    <p th:text="${error}"></p>
</div>

<form th:action="@{/admin/schemes/save}" th:object="${scheme}" method="post">
    <div>
        <label for="name">Name:</label>
        <input
                type="text"
                id="name"
                th:field="*{name}"
                aria-label="Scheme Name"
                placeholder="Enter scheme name"
                required />
    </div>
    <div>
        <label for="description">Description:</label>
        <textarea
                id="description"
                th:field="*{description}"
                aria-label="Scheme Description"
                placeholder="Enter scheme description"
                required></textarea>
    </div>
    <div>
        <label for="eligibilityCriteria">Eligibility Criteria:</label>
        <textarea
                id="eligibilityCriteria"
                th:field="*{eligibility}"
                aria-label="Eligibility Criteria"
                placeholder="Define eligibility criteria"
                required></textarea>
    </div>
    <div>
        <label for="benefits">Benefits:</label>
        <textarea
                id="benefits"
                th:field="*{benefits}"
                aria-label="Benefits"
                placeholder="List the scheme benefits"
                required></textarea>
    </div>
    <div>
        <label for="termsAndConditions">Terms and Conditions:</label>
        <textarea
                id="termsAndConditions"
                th:field="*{termsAndConditions}"
                aria-label="Terms and Conditions"
                placeholder="Enter terms and conditions"
                required></textarea>
    </div>
<!--    <div>-->
<!--        <label for="policy">Policy:</label>-->
<!--        <select id="policy" th:field="*{policies}" required>-->
<!--            <option value="" disabled selected>Select a policy</option>-->
<!--            <option th:each="policy : ${policies}" th:value="${policies.policyId}" th:text="${policy.name}"></option>-->
<!--        </select>-->
<!--    </div>-->

    <div>
        <button type="submit" aria-label="Save Scheme">Save Scheme</button>
    </div>
</form>
</body>
</html>
