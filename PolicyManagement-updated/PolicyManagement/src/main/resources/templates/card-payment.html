<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment</title>
</head>
<body>
<h1>Card Payment</h1>
<form th:action="@{/customer/payment/card(policyId=${policy.policyId})}" method="post">
    <input type="hidden" name="policyId" th:value="${policy.policyId}">

    <label for="cardNumber">Card Number:</label>
    <input type="text" id="cardNumber" name="cardNumber" required><br>

    <label for="expiryDate">Expiry Date:</label>
    <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required><br>

    <label for="cvv">CVV:</label>
    <input type="password" id="cvv" name="cvv" required><br>

    <button type="submit">Submit Payment</button>
</form>
</body>
</html>
