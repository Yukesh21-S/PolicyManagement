<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Claims Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Pending Claims</h1>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Claim ID</th>
            <th>Policy Name</th>
            <th>Customer Name</th>
            <th>Claim Reason</th>
            <th>Claim Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="claim : ${pendingClaims}">
            <td th:text="${claim.claimId}"></td>
            <td th:text="${claim.policy.name}"></td>
            <td th:text="${claim.customer.name}"></td>
            <td th:text="${claim.claimReason}"></td>
            <td th:text="${#dates.format(claim.claimDate, 'yyyy-MM-dd')}"></td>
            <td>
                <form th:action="@{/admin/claims/updateStatus/{id}(id=${claim.claimId})}" method="post">
                    <button type="submit" name="status" value="APPROVED" class="btn btn-success btn-sm">Approve</button>
                    <button type="submit" name="status" value="REJECTED" class="btn btn-danger btn-sm">Reject</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
