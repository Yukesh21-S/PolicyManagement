<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Claims for Policy</title>
</head>
<body>

<h1 th:text="'Claims for Policy: ' + ${policyName}"></h1>

<!-- Display error message if present -->
<div th:if="${errorMessage != null}">
    <p style="color: red;" th:text="${errorMessage}"></p>
</div>

<!-- Display informational message if no customers have claimed -->
<div th:if="${message != null}">
    <p th:text="${message}"></p>
</div>

<!-- Display table if there are claimed customers -->
<div th:if="${customers != null && !customers.isEmpty()}">
    <table border="1">
        <thead>
        <tr>
            <th>Customer Name</th>
            <th>Customer Email</th>
            <th>Contact Number</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.name}"></td>
            <td th:text="${customer.email}"></td>
            <td th:text="${customer.phoneNumber}"></td>
        </tr>
        </tbody>
    </table>
</div>

<a href="/admin/policies">Back to Policies</a>
</body>
</html>
