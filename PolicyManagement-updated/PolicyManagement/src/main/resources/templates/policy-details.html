<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Policy List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .policy-details, .feedback-section, .feedback-form {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .feedback-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fff;
        }
        .feedback-card h4 {
            margin: 0 0 10px;
        }
        .feedback-card p {
            margin: 5px 0;
        }
        .feedback-card .rating {
            color: #f39c12;
        }
        .submit-btn {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<h1>Details of Policies</h1>
<p><strong>Policy Name:</strong> <span th:text="${policy.name}">Policy Name</span></p>
<p><strong>Description:</strong> <span th:text="${policy.description}">Description</span></p>
<p><strong>Premium Amount:</strong> <span th:text="${policy.premiumAmount}">Premium Amount</span></p>
<p><strong>Start Date:</strong> <span th:text="${policy.startDate}">Start Date</span></p>
<p><strong>Maturity Amount:</strong> <span th:text="${policy.maturityAmount}">Maturity Amount</span></p>

<form th:action="@{/customer/apply-policy/{policyId}(policyId=${policy.policyId})}" method="post">
    <label for="paymentMethod">Payment Method:</label>
    <select id="paymentMethod" name="paymentMethod">
        <option value="CARD">CARD</option>
        <option value="UPI">UPI</option>
        <option value="NET_BANKING">Net Banking</option>
    </select>
    <button type="submit">Apply for Policy</button>
</form>


<!-- Feedback List Section -->
<div class="feedback-section">
    <h2>Feedback from Customers</h2>
    <div th:each="feedback : ${feedback}" class="feedback-card">
        <h4 th:text="${feedback.customer.name}">Customer Name</h4>
        <p th:text="${feedback.comment}">Feedback Comment</p>
        <p><strong>Rating:</strong> <span class="rating" th:text="${feedback.rating}">Rating</span>/5</p>
        <span th:text="${feedback.submittedAt != null ? feedback.submittedAt : 'Unknown Date'}"></span>


    </div>
    <div class="feedback-form">
        <h2>Submit Your Feedback</h2>
        <form th:action="@{/customer/feedback/submit/{policyId}(policyId=${policy.policyId})}" method="post">
            <label for="comment">Your Comment:</label>
            <textarea id="comment" name="comment" rows="4" cols="50" required></textarea>
            <br><br>
            <label for="rating">Your Rating:</label>
            <select id="rating" name="rating" required>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>
            <br><br>
            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </div>

</body>
</html>
