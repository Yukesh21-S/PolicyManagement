<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scheme List</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }

        h1 {
            color: #2e6da4;
            text-align: center;
        }

        .scheme-list {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .scheme-list table {
            width: 100%;
            border-collapse: collapse;
        }

        .scheme-list th, .scheme-list td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .scheme-list th {
            background-color: #428aac;
            color: white;
        }

        .scheme-list td {
            background-color: #f9f9f9;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        .button-container a {
            padding: 10px 20px;
            background-color: #428aac;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .button-container a:hover {
            background-color: #5a9db0;
        }

        .deactivate-button {
            padding: 5px 10px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .deactivate-button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
<h1>List of Schemes</h1>

<div class="scheme-list">
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Status</th>
            <th>Eligibility</th>
            <th>Benefits</th>
            <th>Terms and Conditions</th>
            <th>Actions</th> <!-- Added an Actions column for the deactivate button -->
        </tr>
        </thead>
        <tbody>
        <!-- Loop through each scheme in the list -->
        <tr th:each="scheme : ${schemes}">
            <td th:text="${scheme.name}"></td>
            <td th:text="${scheme.description}"></td>
            <td th:text="${scheme.status}"></td>
            <td th:text="${scheme.eligibility}"></td>
            <td th:text="${scheme.benefits}"></td>
            <td th:text="${scheme.termsAndConditions}"></td>
            <td>
                <!-- Deactivate button -->
                <!--/*@thymesVar id="id" type=""*/-->
                <form th:action="@{/admin/schemes/{id}/deactivate(id=${scheme.schemeId})}" method="post">
                    <button type="submit" class="deactivate-button">Deactivate</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="button-container">
    <a href="/admin/schemes/new">Create New Scheme</a>
</div>
</body>
</html>
